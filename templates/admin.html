<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin — Limo Companies</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    [data-theme="light"] {
      --bg:          #f5f5f5;
      --card-bg:     #ffffff;
      --header-bg:   #10101c;
      --text:        #333333;
      --text-muted:  #888888;
      --border:      #e5e5e5;
      --shadow:      rgba(0,0,0,0.07);
      --input-bg:    #ffffff;
      --toggle-bg:   #e2e8f0;
    }
    [data-theme="dark"] {
      --bg:          #0f0f1a;
      --card-bg:     #1e1e2e;
      --header-bg:   #0a0a14;
      --text:        #e2e8f0;
      --text-muted:  #64748b;
      --border:      #2d2d42;
      --shadow:      rgba(0,0,0,0.3);
      --input-bg:    #16162a;
      --toggle-bg:   #2d2d42;
    }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      transition: background 0.3s, color 0.3s;
    }

    header {
      background: var(--header-bg);
      color: white;
      padding: 18px 30px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    header h1 { font-size: 1.4rem; letter-spacing: 1px; }
    .header-right { display: flex; align-items: center; gap: 12px; }

    .theme-toggle {
      background: var(--toggle-bg);
      border: none;
      border-radius: 50px;
      padding: 6px 14px;
      cursor: pointer;
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--text);
    }

    .container { padding: 24px 30px; max-width: 1200px; margin: 0 auto; }

    .toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .toolbar h2 { font-size: 1.15rem; }

    .btn {
      border: none;
      border-radius: 8px;
      padding: 10px 18px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .btn:hover { opacity: 0.85; }
    .btn-primary { background: #6366f1; color: white; }
    .btn-danger  { background: #ef4444; color: white; }
    .btn-warn    { background: #f39c12; color: white; }
    .btn-fleet   { background: #b8860b; color: white; }
    .btn-sm      { padding: 6px 12px; font-size: 0.78rem; }

    /* Owners table */
    .owners-table {
      width: 100%;
      background: var(--card-bg);
      border-radius: 12px;
      box-shadow: 0 2px 10px var(--shadow);
      border-collapse: collapse;
      overflow: hidden;
    }
    .owners-table th, .owners-table td {
      text-align: left;
      padding: 13px 16px;
      font-size: 0.86rem;
      border-bottom: 1px solid var(--border);
    }
    .owners-table th { color: var(--text-muted); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.5px; }
    .owners-table tr:last-child td { border-bottom: none; }
    .owners-table a { color: #6366f1; font-weight: 600; text-decoration: none; }

    .badge {
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 0.72rem;
      font-weight: 600;
    }
    .badge-active   { background: #d1e7dd; color: #0a3622; }
    .badge-inactive { background: #f8d7da; color: #842029; }
    [data-theme="dark"] .badge-active   { background: #052e16; color: #4ade80; }
    [data-theme="dark"] .badge-inactive { background: #450a0a; color: #f87171; }

    td.actions { white-space: nowrap; }
    .actions { display: flex; gap: 6px; flex-wrap: nowrap; align-items: center; }

    /* Modal */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.55);
      z-index: 50;
      align-items: flex-start;
      justify-content: center;
      padding: 40px 16px;
      overflow-y: auto;
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: var(--card-bg);
      border-radius: 14px;
      padding: 26px;
      width: 100%;
      max-width: 540px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.3);
    }
    .modal.wide { max-width: 760px; }
    .modal h3 { margin-bottom: 18px; font-size: 1.1rem; }

    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .form-grid .full { grid-column: 1 / -1; }
    .field label {
      display: block;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 4px;
    }
    .field input, .field select, .field textarea {
      width: 100%;
      padding: 9px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--input-bg);
      color: var(--text);
      font-size: 0.86rem;
      font-family: inherit;
    }
    .field input:focus, .field select:focus, .field textarea:focus {
      outline: 2px solid #6366f1; border-color: transparent;
    }

    .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }

    /* Fleet table inside the fleet modal */
    .fleet-table { width: 100%; border-collapse: collapse; margin-bottom: 18px; }
    .fleet-table th, .fleet-table td {
      text-align: left;
      padding: 8px 10px;
      font-size: 0.8rem;
      border-bottom: 1px solid var(--border);
    }
    .fleet-table th { color: var(--text-muted); font-size: 0.7rem; text-transform: uppercase; }
    .fleet-form-title { font-size: 0.85rem; font-weight: 700; margin: 14px 0 10px; color: var(--text-muted); }

    /* Credentials box */
    .creds-box {
      background: var(--input-bg);
      border: 2px dashed #6366f1;
      border-radius: 10px;
      padding: 18px;
      margin-top: 14px;
      font-family: Consolas, monospace;
      font-size: 0.95rem;
      line-height: 1.8;
    }
    .creds-note { font-size: 0.75rem; color: var(--text-muted); margin-top: 8px; }

    .error-msg { color: #ef4444; font-size: 0.82rem; margin-top: 10px; }

    .empty { text-align: center; padding: 50px; color: var(--text-muted); }

    /* ── Mobile ── */
    @media (max-width: 768px) {
      header { padding: 14px 16px; flex-wrap: wrap; gap: 10px; }
      header h1 { font-size: 1.05rem; }
      .container { padding: 16px; }
      .toolbar { flex-direction: column; align-items: stretch; gap: 12px; }
      .toolbar .btn { width: 100%; }

      /* Table becomes stacked cards */
      .owners-table, .owners-table tbody, .owners-table tr, .owners-table td {
        display: block;
        width: 100%;
      }
      .owners-table thead { display: none; }
      .owners-table { background: transparent; box-shadow: none; }
      .owners-table tr {
        background: var(--card-bg);
        border-radius: 12px;
        box-shadow: 0 2px 10px var(--shadow);
        margin-bottom: 14px;
        padding: 6px 0;
        overflow: hidden;
      }
      .owners-table td {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        padding: 9px 16px;
        border-bottom: 1px solid var(--border);
        font-size: 0.84rem;
      }
      .owners-table tr td:last-child { border-bottom: none; }
      .owners-table td::before {
        content: attr(data-label);
        font-size: 0.7rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        color: var(--text-muted);
        flex-shrink: 0;
      }
      td.actions { white-space: normal; }
      .actions { flex-wrap: wrap; justify-content: flex-end; }
      .actions::before { display: none; }
      .actions .btn-sm { flex: 1 1 calc(50% - 6px); }

      /* Modal form single column */
      .modal-overlay { padding: 16px 10px; }
      .modal { padding: 18px; }
      .form-grid { grid-template-columns: 1fr; }
      .modal-actions { flex-direction: column-reverse; }
      .modal-actions .btn { width: 100%; }
      .fleet-table { display: block; overflow-x: auto; }
    }
  </style>
</head>
<body>

<header>
  <h1>Admin — Limo Companies</h1>
  <div class="header-right">
    <button class="theme-toggle" onclick="toggleTheme()" id="theme-btn">🌙 Dark Mode</button>
    <a href="/logout" style="background:#ef4444;color:white;border-radius:50px;padding:6px 14px;font-size:0.82rem;font-weight:600;text-decoration:none;">Logout</a>
  </div>
</header>

<div class="container">
  <div class="toolbar">
    <h2>All Companies</h2>
    <button class="btn btn-primary" onclick="openCreate()">+ Add Company</button>
  </div>

  <table class="owners-table">
    <thead>
      <tr>
        <th>ID</th><th>Company</th><th>Owner</th><th>Username</th>
        <th>WhatsApp Phone ID</th><th>Bookings</th><th>Revenue</th><th>Status</th><th>Actions</th>
      </tr>
    </thead>
    <tbody id="owners-body"></tbody>
  </table>
  <div class="empty" id="empty-state" style="display:none;">No companies yet. Click "+ Add Company" to create one.</div>
</div>

<!-- Create / Edit modal -->
<div class="modal-overlay" id="owner-modal">
  <div class="modal">
    <h3 id="modal-title">Add Company</h3>
    <div class="form-grid">
      <div class="field"><label>Username *</label><input id="f-username" placeholder="e.g. elitelimos"></div>
      <div class="field"><label>Owner Name *</label><input id="f-owner_name" placeholder="e.g. James Carter"></div>
      <div class="field full"><label>Company Name *</label><input id="f-business_name" placeholder="e.g. Elite Limousines"></div>
      <div class="field"><label>Availability Hours</label><input id="f-hours" placeholder="24/7, advance booking recommended"></div>
      <div class="field"><label>Dispatcher Alert Phone</label><input id="f-admin_phone" placeholder="15550001111"></div>
      <div class="field full"><label>Base Location</label><input id="f-location" placeholder="Head office / garage address"></div>
      <div class="field"><label>Service Area</label><input id="f-service_area" placeholder="City-wide + airport transfers"></div>
      <div class="field"><label>Currency Symbol</label><input id="f-currency" placeholder="£"></div>
      <div class="field"><label>Booking Deposit (0 = none)</label><input id="f-deposit_amount" type="number" placeholder="50"></div>
      <div class="field full"><label>Payment Link (shown with the deposit request)</label><input id="f-payment_link" placeholder="https://buy.stripe.com/..."></div>
      <div class="field"><label>Bot Type</label>
        <select id="f-bot_type">
          <option value="fleet">Fleet — vehicle bookings</option>
          <option value="enquiry">Enquiry — Q&amp;A + consultation leads</option>
        </select>
      </div>
      <div class="field full"><label>Knowledge / Business Profile (used by enquiry bots to answer questions)</label>
        <textarea id="f-knowledge" rows="6" placeholder="Company overview, services, locations, contact details..."></textarea>
      </div>
      <div class="field full"><label>WhatsApp Token</label><input id="f-whatsapp_token" placeholder="EAAxxxx..."></div>
      <div class="field"><label>WhatsApp Phone ID</label><input id="f-whatsapp_phone_id" placeholder="1132931713234299"></div>
      <div class="field full"><label>Voice Agent Number (the number customers call)</label><input id="f-voice_phone" placeholder="+1 555 000 1111"></div>
      <div class="field"><label>Facebook Page ID</label><input id="f-fb_page_id" placeholder="1029384756"></div>
      <div class="field"><label>Instagram Account ID</label><input id="f-ig_account_id" placeholder="17841400000000000"></div>
      <div class="field full"><label>Facebook Page Token (Messenger + page-linked Instagram)</label><input id="f-fb_page_token" placeholder="EAAxxxx..."></div>
      <div class="field full"><label>Instagram Token (only if connected with Instagram Login)</label><input id="f-ig_token" placeholder="IGAAxxxx..."></div>
      <div class="field full">
        <label>Fleet Card Image (PNG/JPG/WebP, max 5 MB — sent to customers on WhatsApp)</label>
        <input type="file" id="f-fleet_file" accept="image/png,image/jpeg,image/webp">
        <div id="current-image-note" style="font-size:0.75rem;color:var(--text-muted);margin-top:4px;"></div>
      </div>
    </div>
    <div class="error-msg" id="modal-error"></div>
    <div id="creds-result"></div>
    <div class="modal-actions">
      <button class="btn" style="background:var(--toggle-bg);color:var(--text);" onclick="closeModal()">Close</button>
      <button class="btn btn-primary" id="save-btn" onclick="saveOwner()">Save</button>
    </div>
  </div>
</div>

<!-- Fleet management modal -->
<div class="modal-overlay" id="fleet-modal">
  <div class="modal wide">
    <h3 id="fleet-title">Fleet</h3>
    <table class="fleet-table">
      <thead>
        <tr>
          <th>Category</th><th>Vehicle</th><th>Seats</th><th>Hourly</th>
          <th>Min Hrs</th><th>Airport</th><th>Daily</th><th>Status</th><th></th>
        </tr>
      </thead>
      <tbody id="fleet-body"></tbody>
    </table>
    <div class="empty" id="fleet-empty" style="display:none;padding:20px;">No vehicles yet — add the first one below.</div>

    <div class="fleet-form-title" id="fleet-form-title">ADD VEHICLE</div>
    <div class="form-grid">
      <div class="field"><label>Category *</label><input id="v-category" placeholder="e.g. Luxury SUVs"></div>
      <div class="field"><label>Vehicle Name *</label><input id="v-name" placeholder="e.g. Cadillac Escalade"></div>
      <div class="field"><label>Capacity (passengers)</label><input id="v-capacity" type="number" placeholder="6"></div>
      <div class="field"><label>Hourly Rate</label><input id="v-hourly_rate" type="number" placeholder="110"></div>
      <div class="field"><label>Minimum Hours</label><input id="v-min_hours" type="number" placeholder="2"></div>
      <div class="field"><label>Airport Transfer Flat Rate (0 = not offered)</label><input id="v-airport_rate" type="number" placeholder="150"></div>
      <div class="field"><label>Daily Hire Rate (0 = not offered)</label><input id="v-daily_rate" type="number" placeholder="400"></div>
      <div class="field full"><label>Description (shown to customers by the bot)</label><input id="v-description" placeholder="Leather interior, WiFi, luggage space..."></div>
    </div>
    <div class="error-msg" id="fleet-error"></div>
    <div class="modal-actions">
      <button class="btn" style="background:var(--toggle-bg);color:var(--text);" onclick="closeFleetModal()">Close</button>
      <button class="btn" id="v-cancel-edit" style="display:none;background:var(--toggle-bg);color:var(--text);" onclick="resetVehicleForm()">Cancel Edit</button>
      <button class="btn btn-fleet" id="v-save-btn" onclick="saveVehicle()">Add Vehicle</button>
    </div>
  </div>
</div>

<script>
  let editingId = null;
  let fleetOwnerId = null;
  let editingVehicleId = null;

  // ── Theme ──
  const savedTheme = localStorage.getItem('theme') || 'light';
  document.documentElement.setAttribute('data-theme', savedTheme);
  updateToggleBtn(savedTheme);
  function toggleTheme() {
    const next = document.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', next);
    localStorage.setItem('theme', next);
    updateToggleBtn(next);
  }
  function updateToggleBtn(theme) {
    document.getElementById('theme-btn').textContent = theme === 'light' ? '🌙 Dark Mode' : '☀️ Light Mode';
  }

  const FIELDS = ['username','owner_name','business_name','hours','admin_phone',
                  'location','service_area','currency','whatsapp_token',
                  'whatsapp_phone_id','voice_phone','fb_page_id','fb_page_token',
                  'ig_account_id','ig_token','deposit_amount','payment_link',
                  'bot_type','knowledge'];

  async function fetchOwners() {
    const r = await fetch('/admin/owners');
    const data = await r.json();
    renderOwners(data.owners);
  }

  function renderOwners(owners) {
    window._owners = owners;
    const body = document.getElementById('owners-body');
    document.getElementById('empty-state').style.display = owners.length ? 'none' : 'block';
    body.innerHTML = owners.map(o => `
      <tr>
        <td data-label="ID">#${o.id}</td>
        <td data-label="Company"><a href="/bookings?owner_id=${o.id}">${o.business_name}</a>${o.whatsapp_phone_id ? ' <span title="This company answers the WhatsApp number">📱</span>' : ''}</td>
        <td data-label="Owner">${o.owner_name}</td>
        <td data-label="Username">${o.username}</td>
        <td data-label="Phone ID">${o.whatsapp_phone_id || '—'}</td>
        <td data-label="Bookings">${o.booking_count}</td>
        <td data-label="Revenue">${o.currency || '$'}${Number(o.revenue).toLocaleString()}</td>
        <td data-label="Status"><span class="badge ${o.active ? 'badge-active' : 'badge-inactive'}">${o.active ? 'Active' : 'Disabled'}</span></td>
        <td class="actions">
          ${o.whatsapp_phone_id ? '' : `<button class="btn btn-sm" style="background:#0e9f6e;color:white;" onclick='takeNumber(${o.id})'>Use 📱</button>`}
          <button class="btn btn-fleet btn-sm" onclick='openFleet(${o.id}, ${JSON.stringify(o.business_name)})'>Fleet</button>
          <button class="btn btn-primary btn-sm" onclick='openEdit(${JSON.stringify(o)})'>Edit</button>
          <button class="btn btn-warn btn-sm" onclick="resetPassword(${o.id}, '${o.username}')">Reset PW</button>
          <button class="btn btn-sm" style="background:var(--toggle-bg);color:var(--text);"
                  onclick="toggleActive(${o.id}, ${o.active})">${o.active ? 'Disable' : 'Enable'}</button>
          <button class="btn btn-danger btn-sm" onclick='removeOwner(${o.id}, ${JSON.stringify(o.business_name)})'>Delete</button>
        </td>
      </tr>`).join('');
  }

  function openCreate() {
    editingId = null;
    document.getElementById('modal-title').textContent = 'Add Company';
    FIELDS.forEach(f => document.getElementById('f-' + f).value = '');
    document.getElementById('f-currency').value = '$';
    document.getElementById('f-bot_type').value = 'fleet';
    document.getElementById('f-fleet_file').value = '';
    document.getElementById('current-image-note').textContent = '';
    document.getElementById('f-username').disabled = false;
    document.getElementById('modal-error').textContent = '';
    document.getElementById('creds-result').innerHTML = '';
    document.getElementById('save-btn').style.display = '';
    document.getElementById('owner-modal').classList.add('open');
  }

  function openEdit(o) {
    editingId = o.id;
    document.getElementById('modal-title').textContent = 'Edit Company — ' + o.business_name;
    FIELDS.forEach(f => document.getElementById('f-' + f).value = o[f] || '');
    document.getElementById('f-fleet_file').value = '';
    document.getElementById('current-image-note').textContent =
      o.fleet_image_url ? 'Current image: ' + o.fleet_image_url + ' (choose a file to replace it)' : 'No fleet image uploaded yet.';
    document.getElementById('f-username').disabled = true;
    document.getElementById('modal-error').textContent = '';
    document.getElementById('creds-result').innerHTML = '';
    document.getElementById('save-btn').style.display = '';
    document.getElementById('owner-modal').classList.add('open');
  }

  function closeModal() {
    document.getElementById('owner-modal').classList.remove('open');
    fetchOwners();
  }

  function formData() {
    const data = {};
    FIELDS.forEach(f => data[f] = document.getElementById('f-' + f).value.trim());
    return data;
  }

  async function uploadFleetImage(ownerId) {
    const fileInput = document.getElementById('f-fleet_file');
    if (!fileInput.files.length) return null;
    const fd = new FormData();
    fd.append('image', fileInput.files[0]);
    const r = await fetch(`/admin/owners/${ownerId}/fleet-image`, { method: 'POST', body: fd });
    const res = await r.json();
    return res.success ? null : (res.error || 'Image upload failed');
  }

  async function saveOwner() {
    const data = formData();
    const errEl = document.getElementById('modal-error');
    errEl.textContent = '';

    const url    = editingId ? `/admin/owners/${editingId}` : '/admin/owners';
    const method = editingId ? 'PUT' : 'POST';
    const r = await fetch(url, {
      method,
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data)
    });
    const res = await r.json();

    if (!res.success) {
      errEl.textContent = res.error || 'Something went wrong';
      return;
    }

    // Upload fleet image if one was chosen
    const imgErr = await uploadFleetImage(editingId || res.owner_id);
    if (imgErr) {
      errEl.textContent = 'Company saved, but: ' + imgErr;
    }

    if (res.credentials) {
      // Show generated credentials ONCE
      document.getElementById('creds-result').innerHTML = `
        <div class="creds-box">
          Username: <b>${res.credentials.username}</b><br>
          Password: <b>${res.credentials.password}</b>
        </div>
        <div class="creds-note">Copy these now and share with the company owner — the password is not shown again.</div>`;
      document.getElementById('save-btn').style.display = 'none';
    } else {
      closeModal();
    }
  }

  // ── Move the WhatsApp number between companies (which bot answers it) ──
  async function takeNumber(targetId) {
    const owners = window._owners || [];
    const target = owners.find(o => o.id === targetId);
    const holders = owners.filter(o => o.id !== targetId && o.whatsapp_phone_id);
    if (!holders.length) {
      alert('No company currently holds a WhatsApp number.');
      return;
    }
    let holder = holders[0];
    if (holders.length > 1) {
      const names = holders.map((h, i) => `${i + 1}. ${h.business_name}`).join('\n');
      const pick = prompt(`Take the number from which company?\n${names}\n\nEnter a number:`, '1');
      holder = holders[parseInt(pick, 10) - 1];
      if (!holder) return;
    }
    if (!confirm(`Move the WhatsApp number from "${holder.business_name}" to "${target.business_name}"?\n\nCustomers messaging the number will then talk to ${target.business_name}.`)) return;

    // Set on target first, then clear the old holder (routing prefers the newest)
    await fetch(`/admin/owners/${targetId}`, {
      method: 'PUT', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ whatsapp_phone_id: holder.whatsapp_phone_id,
                             whatsapp_token: holder.whatsapp_token })
    });
    await fetch(`/admin/owners/${holder.id}`, {
      method: 'PUT', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ whatsapp_phone_id: '', whatsapp_token: '' })
    });
    fetchOwners();
  }

  async function resetPassword(id, username) {
    if (!confirm(`Generate a new password for ${username}?`)) return;
    const r = await fetch(`/admin/owners/${id}/reset-password`, { method: 'POST' });
    const res = await r.json();
    if (res.success) {
      alert(`New credentials for ${username}:\n\nUsername: ${username}\nPassword: ${res.password}\n\nCopy now — it is not shown again.`);
    }
  }

  async function toggleActive(id, active) {
    await fetch(`/admin/owners/${id}`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ active: !active })
    });
    fetchOwners();
  }

  async function removeOwner(id, name) {
    if (!confirm(`Delete "${name}" and ALL their bookings and fleet? This cannot be undone.`)) return;
    await fetch(`/admin/owners/${id}`, { method: 'DELETE' });
    fetchOwners();
  }

  // ── Fleet management ──
  const V_FIELDS = ['category','name','capacity','hourly_rate','min_hours','airport_rate','daily_rate','description'];

  async function openFleet(ownerId, businessName) {
    fleetOwnerId = ownerId;
    document.getElementById('fleet-title').textContent = 'Fleet — ' + businessName;
    resetVehicleForm();
    document.getElementById('fleet-modal').classList.add('open');
    await loadFleet();
  }

  function closeFleetModal() {
    document.getElementById('fleet-modal').classList.remove('open');
    fleetOwnerId = null;
  }

  async function loadFleet() {
    const r = await fetch(`/admin/owners/${fleetOwnerId}/vehicles`);
    const data = await r.json();
    renderFleet(data.vehicles || []);
  }

  function renderFleet(vehicles) {
    const body = document.getElementById('fleet-body');
    document.getElementById('fleet-empty').style.display = vehicles.length ? 'none' : 'block';
    body.innerHTML = vehicles.map(v => `
      <tr>
        <td>${v.category}</td>
        <td>${v.name}</td>
        <td>${v.capacity}</td>
        <td>${v.hourly_rate}/hr</td>
        <td>${v.min_hours}</td>
        <td>${v.airport_rate ? v.airport_rate : '—'}</td>
        <td>${v.daily_rate ? v.daily_rate + '/day' : '—'}</td>
        <td><span class="badge ${v.available ? 'badge-active' : 'badge-inactive'}">${v.available ? 'Available' : 'Hidden'}</span></td>
        <td style="white-space:nowrap;">
          <button class="btn btn-primary btn-sm" onclick='editVehicle(${JSON.stringify(v)})'>Edit</button>
          <button class="btn btn-sm" style="background:var(--toggle-bg);color:var(--text);"
                  onclick="toggleVehicle(${v.id}, ${v.available})">${v.available ? 'Hide' : 'Show'}</button>
          <button class="btn btn-danger btn-sm" onclick='removeVehicle(${v.id}, ${JSON.stringify(v.name)})'>Delete</button>
        </td>
      </tr>`).join('');
  }

  function resetVehicleForm() {
    editingVehicleId = null;
    V_FIELDS.forEach(f => document.getElementById('v-' + f).value = '');
    document.getElementById('fleet-form-title').textContent = 'ADD VEHICLE';
    document.getElementById('v-save-btn').textContent = 'Add Vehicle';
    document.getElementById('v-cancel-edit').style.display = 'none';
    document.getElementById('fleet-error').textContent = '';
  }

  function editVehicle(v) {
    editingVehicleId = v.id;
    V_FIELDS.forEach(f => document.getElementById('v-' + f).value = v[f] != null ? v[f] : '');
    document.getElementById('fleet-form-title').textContent = 'EDIT VEHICLE — ' + v.name;
    document.getElementById('v-save-btn').textContent = 'Save Changes';
    document.getElementById('v-cancel-edit').style.display = '';
  }

  async function saveVehicle() {
    const errEl = document.getElementById('fleet-error');
    errEl.textContent = '';
    const data = {};
    V_FIELDS.forEach(f => data[f] = document.getElementById('v-' + f).value.trim());
    if (!data.category || !data.name) {
      errEl.textContent = 'Category and vehicle name are required';
      return;
    }
    data.capacity     = data.capacity || 4;
    data.hourly_rate  = data.hourly_rate || 0;
    data.min_hours    = data.min_hours || 2;
    data.airport_rate = data.airport_rate || 0;
    data.daily_rate   = data.daily_rate || 0;

    const url = editingVehicleId
      ? `/admin/owners/${fleetOwnerId}/vehicles/${editingVehicleId}`
      : `/admin/owners/${fleetOwnerId}/vehicles`;
    const r = await fetch(url, {
      method: editingVehicleId ? 'PUT' : 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data)
    });
    const res = await r.json();
    if (!res.success) {
      errEl.textContent = res.error || 'Something went wrong';
      return;
    }
    resetVehicleForm();
    await loadFleet();
  }

  async function toggleVehicle(id, available) {
    await fetch(`/admin/owners/${fleetOwnerId}/vehicles/${id}`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ available: !available })
    });
    await loadFleet();
  }

  async function removeVehicle(id, name) {
    if (!confirm(`Delete "${name}" from the fleet?`)) return;
    await fetch(`/admin/owners/${fleetOwnerId}/vehicles/${id}`, { method: 'DELETE' });
    await loadFleet();
  }

  fetchOwners();
</script>
</body>
</html>
